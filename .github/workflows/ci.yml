name: Documentation integrity
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required skill files
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md SKILL.md LICENSE references/quick-audit.md references/verification-records.md; do
            test -s "$f" || { echo "Missing or empty: $f" >&2; exit 1; }
          done
      - name: No unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- '*.md' 'references/*.md'; then
            echo "Unresolved merge markers" >&2
            exit 1
          fi
